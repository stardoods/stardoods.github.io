permalink: /404.html
---

<!DOCTYPE html>
<html lang="en">
    <head>
        <script>
            (() => { // apply colours before all else to prevent flickering on page transition
                const root = document.documentElement;
                const isDarkMode = localStorage.getItem('theme') === 'dark';
                const savedScroll = sessionStorage.getItem('virtualScrollTop');

                let scrollTop = savedScroll !== null
                    ? Number(savedScroll)
                    : 0;

                if (!Number.isFinite(scrollTop)) {
                    scrollTop = 0;
                }

                const lightHue =
                    ((scrollTop / 20000) * 360) % 360;

                const darkHue =
                    ((scrollTop / 17000) * 360) % 360;

                const normalise = hue => (hue + 360) % 360;

                const light = `hsl(${normalise(lightHue)}, ${
                    isDarkMode ? 40 : 20
                }%, 95%)`;

                const dark = `hsl(${normalise(darkHue)}, ${
                    isDarkMode ? 20 : 100
                }%, ${isDarkMode ? 15 : 25}%)`;

                const accent =
                    `hsl(${normalise(lightHue)}, 80%, 40%)`;

                root.dataset.theme = isDarkMode ? 'dark' : 'light';

                if (isDarkMode) {
                    root.style.setProperty('--light', dark);
                    root.style.setProperty('--dark', light);
                } else {
                    root.style.setProperty('--light', light);
                    root.style.setProperty('--dark', dark);
                }

                root.style.setProperty('--accent', accent);
            })();
        </script>
        <script src="{{ '/assets/js/color-change.js' | prepend: site.baseurl }}"></script>
        
        {% include head.html %}
    
        <link rel="stylesheet" href="{{ '/assets/css/style.css' | prepend: site.baseurl }}">
        <link rel="stylesheet" href="{{ '/assets/css/404.css' | prepend: site.baseurl }}">
    </head>
    <body>
        <div class="blank-page">
        <div class="not-found-msg">
            <h1 class="sour-face">404</h1>
            <p style="font-size:1.75rem;">Page Not Found!</p>
            <p style="font-size:1.25rem;">A pillager must've taken it...</p>
            <a href="{{ '/' | prepend: site.baseurl }}">HOME</a>
        </div>
        </div>
    </body>
</html>
